<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Реклама</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        video {
            width: 100%;
            max-height: 60vh;
            border-radius: 12px;
            margin-bottom: 20px;
            object-fit: contain;
            background: #000;
        }
        #status {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
            text-align: center;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 80%;
            max-width: 300px;
            font-weight: bold;
            margin-top: 10px;
        }
        button:active {
            opacity: 0.8;
        }
        /* Кнопки изначально скрыты, кроме первой */
        #nextBtn, #finishBtn {
            display: none;
        }
    </style>
</head>
<body>

    <div id="status">Видео 1 из 2</div>
    <video id="adPlayer" controlsList="nodownload" disablePictureInPicture></video>
    
    <!-- Кнопка запуска первого видео -->
    <button id="startBtn">▶️ Начать просмотр</button>
    <!-- Кнопка запуска второго видео -->
    <button id="nextBtn">▶️ Смотреть следующее</button>
    <!-- Кнопка завершения -->
    <button id="finishBtn">✅ Продолжить</button>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        // Показываем на экране, что Telegram API загрузился
        document.getElementById('status').innerText = "Telegram API загружен!";

        const adsList = [
            "ads/ad1.mp4",
            "ads/ad2.mp4"
        ];

        const player = document.getElementById('adPlayer');
        const status = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const nextBtn = document.getElementById('nextBtn');
        const finishBtn = document.getElementById('finishBtn');
        
        let currentAdIndex = 0;

        function playCurrentAd() {
            player.src = adsList[currentAdIndex];
            player.currentTime = 0; 
            player.load();
            player.play().catch(e => {
                console.log("Ошибка автоплея:", e);
            });
            status.innerText = `Видео ${currentAdIndex + 1} из 2`;
        }

        startBtn.onclick = () => {
            startBtn.style.display = 'none'; 
            playCurrentAd();
        };

        player.onended = () => {
            player.currentTime = 0; 
            
            if (currentAdIndex === 0) {
                nextBtn.style.display = 'block';
                status.innerText = "Видео 1 просмотрено!";
            } else {
                finishBtn.style.display = 'block';
                status.innerText = "Реклама просмотрена!";
            }
        };

        nextBtn.onclick = () => {
            nextBtn.style.display = 'none'; 
            currentAdIndex = 1; 
            playCurrentAd();
        };

        // ВОТ ЗДЕСЬ МЫ ДОБАВИЛИ ОТЛАДКУ
        finishBtn.onclick = () => {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const episodeId = urlParams.get('ep');

                if (!episodeId) {
                    alert("Ошибка: ID эпизода не найден в ссылке!");
                    return;
                }

                // Показываем, что отправляем
                alert("Отправляю данные в бота: " + episodeId);
                
                tg.sendData(JSON.stringify({ 
                    action: "ads_watched",
                    episode_id: episodeId
                }));
                
                // Закрываем только после отправки
                setTimeout(() => {
                    tg.close(); 
                }, 500);
                
            } catch (error) {
                alert("Ошибка JavaScript: " + error.message);
            }
        };
    </script>
</body>
</html>
