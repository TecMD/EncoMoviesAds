<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Реклама</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        button {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
            max-width: 300px;
        }
    </style>
</head>
<body>

    <h2 id="status">Загрузка...</h2>
    <button id="testBtn">Нажми меня для теста</button>

    <script>
        const tg = window.Telegram.WebApp;
        const status = document.getElementById('status');
        const testBtn = document.getElementById('testBtn');

        // Показываем, что скрипт запустился
        status.innerText = "Скрипт работает!";

        // Проверяем, есть ли Telegram API
        if (window.Telegram && window.Telegram.WebApp) {
            status.innerText = "Telegram API загружен!";
        } else {
            status.innerText = "Ошибка: Telegram API не загружен!";
        }

        // Кнопка для теста отправки данных
        testBtn.onclick = () => {
            alert("Кнопка нажата! Отправляю данные...");
            
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const episodeId = urlParams.get('ep') || "1"; // Если нет, ставим 1
                
                tg.sendData(JSON.stringify({ 
                    action: "ads_watched",
                    episode_id: episodeId
                }));
                
                alert("Данные отправлены!");
                tg.close();
            } catch (e) {
                alert("Ошибка: " + e.message);
            }
        };
    </script>
</body>
</html>
