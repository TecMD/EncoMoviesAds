<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Реклама</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #17212b; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        button { padding: 15px 30px; font-size: 18px; margin-top: 20px; background: #2481cc; color: white; border: none; border-radius: 8px; }
        #debug { position: absolute; top: 10px; left: 10px; right: 10px; text-align: center; font-size: 14px; color: #ffcc00; }
    </style>
</head>
<body>

    <div id="debug">Загрузка...</div>
    <h1>ТЕСТ РЕКЛАМЫ</h1>
    <button id="testBtn">ЗАВЕРШИТЬ И ОТПРАВИТЬ</button>

    <script>
        const tg = window.Telegram.WebApp;
        const debug = document.getElementById('debug');
        
        // Проверяем, загрузился ли Telegram API
        if (window.Telegram && window.Telegram.WebApp) {
            debug.innerText = "Telegram API загружен!";
        } else {
            debug.innerText = "Ошибка: Telegram API НЕ загружен!";
        }

        document.getElementById('testBtn').onclick = () => {
            // Получаем ID из ссылки
            const urlParams = new URLSearchParams(window.location.search);
            const episodeId = urlParams.get('ep');

            // Показываем, что мы собираемся отправить
            debug.innerText = "Отправляю ID: " + episodeId;
            alert("Отправляю ID: " + episodeId);

            if (!episodeId) {
                alert("ОШИБКА: ID эпизода пустой! В ссылке нет ?ep=");
                return;
            }

            try {
                // Отправляем данные боту
                tg.sendData(JSON.stringify({ 
                    action: "ads_watched",
                    episode_id: episodeId
                }));
                
                debug.innerText = "Данные отправлены! Закрываю...";
                setTimeout(() => tg.close(), 1000);
            } catch (e) {
                alert("Ошибка при отправке: " + e.message);
            }
        };
    </script>
</body>
</html>
