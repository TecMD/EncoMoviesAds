    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        // Твои видео
        const adsList = [
            "ads/ad1.mp4",
            "ads/ad2.mp4"
        ];

        const player = document.getElementById('adPlayer');
        const status = document.getElementById('status');
        const continueBtn = document.getElementById('continueBtn');
        let watchedCount = 0;

        // Добавляем кнопку принудительного запуска (если автоплей заблокирован)
        const playBtn = document.createElement('button');
        playBtn.innerText = "▶️ Нажмите, чтобы играть";
        playBtn.style.display = 'none';
        playBtn.style.marginTop = '10px';
        document.body.insertBefore(playBtn, continueBtn);

        function playNextAd() {
            if (watchedCount >= 2) return;
            
            player.src = adsList[watchedCount];
            player.load();
            
            status.innerText = `Видео ${watchedCount + 1} из 2`;

            // Пытаемся запустить автоматически
            let playPromise = player.play();

            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    // Автозапуск сработал
                    playBtn.style.display = 'none';
                })
                .catch(error => {
                    // Автозапуск заблокирован браузером
                    console.log("Автоплей заблокирован:", error);
                    playBtn.style.display = 'block';
                    playBtn.onclick = () => {
                        player.play();
                        playBtn.style.display = 'none';
                    };
                });
            }
        }

        // Если видео не может загрузиться (неверный путь или файл битый)
        player.onerror = () => {
            status.innerText = `Ошибка загрузки видео ${watchedCount + 1}`;
            status.style.color = "red";
        };

        playNextAd();

        player.onended = () => {
            watchedCount++;
            if (watchedCount < 2) {
                playNextAd();
            } else {
                status.innerText = "Реклама просмотрена!";
                status.style.color = "white";
                player.style.display = 'none';
                playBtn.style.display = 'none';
                continueBtn.style.display = 'block'; 
            }
        };

        continueBtn.onclick = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const episodeId = urlParams.get('ep');
            tg.sendData(JSON.stringify({ 
                action: "ads_watched",
                episode_id: episodeId
            }));
            tg.close(); 
        };
    </script>
